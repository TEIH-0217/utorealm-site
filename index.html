<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Utorealm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0A0F; --text:#F0F0F5; --text-dim:#8A8A99; --hot:#FF2E6E; --cool:#2BFFC6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:'JetBrains Mono',monospace; display:flex; align-items:center; justify-content:center; text-align:center; }
  h1{ font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; font-size:20px; margin:0 0 12px; }
  h1 span{ color:var(--hot); }
  p{ color:var(--text-dim); font-size:13px; margin:0 0 20px; }
  a{ color:var(--cool); text-decoration:none; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; border:1px solid var(--cool); padding:10px 20px; }
  a:hover{ background:rgba(43,255,198,0.08); }
</style>
</head>
<body>
  <div>
    <h1>Utorealm<span>.</span></h1>
    <p>Coming soon.</p>
    <a href="/afterlife/">Enter Afterlife →</a>
  </div>
</body>
</html>
