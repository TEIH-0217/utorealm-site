<svg viewBox="0 0 300 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="stencil-light" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="90">
      <rect x="0" y="0" width="300" height="90" fill="white"/>
      <g fill="black">
        <rect x="0" y="40" width="300" height="3"/>
        <rect x="0" y="55" width="300" height="3"/>
      </g>
    </mask>
  </defs>

  <!-- glitch slice bars -->
  <g opacity="0.4">
    <rect x="0" y="20" width="250" height="4" fill="#0C8F72" opacity="0.35"/>
    <rect x="0" y="48" width="258" height="3" fill="#FF2E6E" opacity="0.3" transform="translate(3,0)"/>
  </g>

  <!-- chromatic aberration wordmark, tactical stencil sans -->
  <g mask="url(#stencil-light)" font-family="'Eurostile','Bank Gothic','Arial Narrow','Helvetica Neue',sans-serif" font-weight="800" font-size="46" letter-spacing="3" font-stretch="condensed">
    <text x="0" y="62" fill="#0C8F72" opacity="0.75" transform="translate(-2,0)">AFTERLIFE</text>
    <text x="0" y="62" fill="#FF2E6E" opacity="0.75" transform="translate(2,0)">AFTERLIFE</text>
    <text x="0" y="62" fill="#16161A">AFTERLIFE</text>
  </g>

  <!-- terminal cursor -->
  <rect x="262" y="16" width="9" height="42" fill="#0C8F72" filter="url(#glow-light)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.55;0.95;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
